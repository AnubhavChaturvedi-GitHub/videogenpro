<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VideoGenPro Studio</title>
  <style>
    :root {
      --bg:#0a0c12; --panel:#11141d; --panel2:#161a26; --panel3:#1c2130; --line:#252b3d;
      --text:#e6eaf5; --dim:#8b93a7; --accent:#3b82f6; --accent2:#2563eb;
      --clip-text:#7c3aed; --clip-image:#0ea5e9; --clip-three:#22c55e; --clip-shape:#f59e0b; --clip-html:#ec4899; --clip-video:#06b6d4;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; background:var(--bg); color:var(--text);
      font-family:Inter,system-ui,-apple-system,sans-serif; font-size:13px; overflow:hidden; }
    #app { display:grid; height:100vh; grid-template-rows:46px 1fr 312px; }
    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-thumb { background:#2a3142; border-radius:6px; }
    button { background:var(--accent); color:#fff; border:0; border-radius:7px; padding:7px 13px;
      font-weight:600; cursor:pointer; font-size:12px; transition:background .12s; }
    button:hover { background:var(--accent2); }
    button.ghost { background:var(--panel3); color:var(--text); }
    button.ghost:hover { background:var(--line); }

    .topbar { display:flex; align-items:center; gap:14px; padding:0 16px; background:var(--panel); border-bottom:1px solid var(--line); }
    .brand { font-weight:800; letter-spacing:.5px; }
    .brand span { color:var(--accent); }
    .spacer { flex:1; }
    .status { font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); transition:background .2s; }
    .dot.saved { background:#22c55e; } .dot.saving { background:#f59e0b; } .dot.edited { background:#3b82f6; }

    .mid { display:grid; grid-template-columns:196px 1fr 326px; overflow:hidden; }

    /* assets panel */
    .assets { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:12px; }
    .sec-title { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:6px 0 8px; }
    .add-row { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:14px; }
    .add-row button { background:var(--panel3); color:var(--text); padding:8px 4px; font-size:11px; }
    .add-row button:hover { background:var(--accent); }
    .add-row button.wide { grid-column:1/3; }
    .drop { border:1.5px dashed #33405c; border-radius:10px; padding:16px 8px; text-align:center; color:var(--dim);
      font-size:11px; cursor:pointer; margin-bottom:12px; transition:all .15s; }
    .drop:hover, .drop.over { border-color:var(--accent); color:var(--text); background:rgba(59,130,246,.08); }
    .asset-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .asset { position:relative; border-radius:8px; overflow:hidden; aspect-ratio:16/10; background:var(--panel3);
      cursor:grab; border:1px solid var(--line); }
    .asset img, .asset video { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
    .asset .nm { position:absolute; bottom:0; left:0; right:0; font-size:9px; padding:2px 4px; background:rgba(0,0,0,.6);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .asset .badge { position:absolute; top:3px; left:3px; font-size:8px; background:var(--accent); padding:1px 5px; border-radius:4px; font-weight:700; }

    /* preview */
    .stagewrap { display:flex; align-items:center; justify-content:center; background:#06080d; overflow:hidden; position:relative; }
    #scaler { position:relative; }
    #stage { position:relative; box-shadow:0 16px 60px rgba(0,0,0,.6); }

    /* properties */
    .props { background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:14px; }
    .props h3 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:16px 0 8px; display:flex; align-items:center; gap:6px; }
    .props h3:first-child { margin-top:0; }
    .sel-head { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; background:var(--panel3); margin-bottom:4px; }
    .sel-head .pill { font-size:10px; font-weight:800; text-transform:uppercase; padding:2px 8px; border-radius:5px; color:#fff; }
    .field { margin-bottom:10px; }
    .field label { display:block; font-size:11px; color:var(--dim); margin-bottom:4px; }
    .field input[type=text], .field textarea, .field select {
      width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
      border-radius:6px; padding:6px 8px; font-size:12px; font-family:inherit; }
    .field textarea { resize:vertical; min-height:46px; }
    .row { display:flex; align-items:center; gap:8px; }
    .row input[type=range] { flex:1; accent-color:var(--accent); }
    .row .val { width:50px; text-align:right; font-variant-numeric:tabular-nums; font-size:11px; color:var(--dim); }

    /* animation gallery */
    .anim-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .anim-card { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:9px; cursor:pointer;
      transition:all .12s; position:relative; }
    .anim-card:hover { border-color:var(--accent); background:var(--panel3); transform:translateY(-1px); }
    .anim-card .nm { font-size:11px; font-weight:700; margin-bottom:3px; }
    .anim-card .ds { font-size:10px; color:var(--dim); line-height:1.3; }
    .anim-card .plus { position:absolute; top:6px; right:8px; color:var(--accent); font-weight:800; opacity:0; }
    .anim-card:hover .plus { opacity:1; }
    .preset-card { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:10px; margin-bottom:8px; }
    .preset-card .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
    .preset-card .head b { font-size:12px; color:#a5b4fc; }
    .preset-card .head button { padding:2px 7px; font-size:11px; background:#3a2030; }
    .empty { color:var(--dim); font-size:12px; padding:30px 10px; text-align:center; line-height:1.5; }

    /* transport + timeline */
    .timeline { background:var(--panel); border-top:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
    .transport { display:flex; align-items:center; gap:14px; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel2); }
    .tp-center { display:flex; align-items:center; gap:8px; }
    .tp-btn { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0; font-size:14px; background:var(--panel3); }
    .tp-btn:hover { background:var(--line); }
    .tp-play { width:42px; height:42px; font-size:17px; background:var(--accent); }
    .tp-play:hover { background:var(--accent2); }
    .tp-time { font-variant-numeric:tabular-nums; font-size:13px; color:var(--text); min-width:120px; }
    .tp-time .tot { color:var(--dim); }
    .tl-scroll { flex:1; overflow:auto; position:relative; }
    #tlInner { position:relative; min-width:100%; }
    .ruler { position:sticky; top:0; height:24px; background:var(--panel2); border-bottom:1px solid var(--line); z-index:5; cursor:pointer; }
    .tick { position:absolute; top:0; height:24px; border-left:1px solid var(--line); font-size:10px; color:var(--dim); padding-left:3px; }
    .scene-band { position:absolute; top:0; height:24px; border-right:2px solid var(--accent); opacity:.35; }
    .track { position:relative; height:40px; border-bottom:1px solid var(--line); }
    .track-label { position:absolute; left:0; top:0; z-index:4; width:92px; height:40px; display:flex; align-items:center;
      padding:0 8px; background:var(--panel2); border-right:1px solid var(--line); font-size:11px; color:var(--dim);
      overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .clip { position:absolute; top:5px; height:30px; border-radius:6px; display:flex; align-items:center; gap:5px;
      padding:0 8px; font-size:11px; color:#fff; cursor:grab; overflow:hidden; white-space:nowrap;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); user-select:none; }
    .clip.sel { box-shadow:inset 0 0 0 2px #fff, 0 0 0 2px var(--accent); }
    .clip .dotmark { font-size:9px; opacity:.85; }
    .clip .handle { position:absolute; right:0; top:0; width:9px; height:100%; cursor:ew-resize; background:rgba(255,255,255,.2); }
    .playhead { position:absolute; top:0; width:2px; background:#ff4d6d; z-index:6; pointer-events:none; }
    .playhead::before { content:''; position:absolute; top:0; left:-5px; border:6px solid transparent; border-top-color:#ff4d6d; }
    .tl-scroll.over { box-shadow:inset 0 0 0 2px var(--accent); }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="brand">VIDEO<span>GEN</span>PRO · Studio</div>
      <div class="spacer"></div>
      <span class="status"><span class="dot saved" id="syncDot"></span><span id="syncText">synced</span></span>
      <button class="ghost" id="export">⬇ Export MP4</button>
    </div>

    <div class="mid">
      <div class="assets">
        <div class="sec-title">Add layer</div>
        <div class="add-row">
          <button id="addText">＋ Text</button>
          <button id="addShape">＋ Shape</button>
          <button id="add3D" class="wide">＋ 3D Particles</button>
        </div>
        <div class="sec-title">Assets</div>
        <div class="drop" id="drop">⬆ Drop images / videos<br/>or click to upload</div>
        <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none" />
        <div class="asset-grid" id="assetGrid"></div>
      </div>

      <div class="stagewrap"><div id="scaler"><div id="stage"></div></div></div>

      <div class="props" id="props"><div class="empty">Select a clip in the timeline to edit it and pick animations.</div></div>
    </div>

    <div class="timeline">
      <div class="transport">
        <div class="tp-time"><span id="tpTime">0.00</span><span class="tot" id="tpTotal"> / 0.00s</span></div>
        <div class="spacer"></div>
        <div class="tp-center">
          <button class="tp-btn" id="tpStart" title="Jump to start">⏮</button>
          <button class="tp-btn" id="tpBack" title="−1s">⏪</button>
          <button class="tp-btn tp-play" id="tpPlay" title="Play / Pause">⏸</button>
          <button class="tp-btn" id="tpFwd" title="+1s">⏩</button>
          <button class="tp-btn" id="tpLoop" title="Loop">🔁</button>
        </div>
        <div class="spacer"></div>
        <button class="ghost" id="zoomOut">－</button>
        <button class="ghost" id="zoomIn">＋</button>
      </div>
      <div class="tl-scroll" id="tlScroll"><div id="tlInner"></div></div>
    </div>
  </div>
  <script src="/packages/renderer/dist/runtime.js"></script>
  <script src="/packages/editor/dist/editor.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VideoGenPro Studio</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap');
    :root {
      /* Brainfish — stickers on construction paper (light, neo-brutalist) */
      --paper:#ffffff; --fog:#f5f5f5; --ink:#000000; --graphite:#171717; --shadow-ink:#0a0a0d;
      --steel:#737373; --iron:#222222; --slate:#333333;
      --lime:#a3e635; --amber:#fbbf25;
      --buttercream:#fef3c8; --mint:#d2fae5; --lilac:#fae9ff; --bubblegum:#f5d1fe;
      --sky:#b7eaf6; --cobalt:#3366e0; --meadow:#b9f0c0;
      --sh1:2px 2px 0 0 var(--shadow-ink); --sh2:4px 4px 0 0 var(--shadow-ink); --sh0:1px 1px 0 0 var(--shadow-ink);
      --rpill:100px; --rcard:16px; --rin:6px;
      --font:'Satoshi','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
      --clip-text:#f5d1fe; --clip-image:#b7eaf6; --clip-three:#b9f0c0; --clip-shape:#fef3c8; --clip-html:#fae9ff; --clip-video:#d2fae5;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; background:var(--fog); color:var(--ink); font-family:var(--font); font-size:13px; font-weight:500; overflow:hidden; -webkit-font-smoothing:antialiased; letter-spacing:-0.01em; }
    #app { display:grid; height:100vh; grid-template-rows:54px 1fr 320px; }
    ::-webkit-scrollbar { width:12px; height:12px; }
    ::-webkit-scrollbar-thumb { background:var(--ink); border-radius:100px; border:3px solid var(--paper); background-clip:padding-box; }
    svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }
    button { font-family:inherit; cursor:pointer; border:0; color:var(--ink); background:transparent; font-weight:500; }
    .btn { background:var(--paper); border:1px solid var(--ink); border-radius:var(--rpill); padding:8px 16px; font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:7px; box-shadow:var(--sh1); transition:transform .08s; }
    .btn:active { transform:translate(2px,2px); box-shadow:none; }
    .btn.primary { background:var(--lime); }

    .topbar { display:flex; align-items:center; gap:14px; padding:0 18px; background:var(--paper); border-bottom:1px solid var(--ink); position:relative; z-index:50; }
    .brand { font-weight:700; letter-spacing:-0.03em; display:flex; align-items:center; gap:9px; font-size:17px; }
    .brand .logo { width:30px; height:30px; border-radius:9px; background:var(--lime); border:1px solid var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:var(--sh0); }
    .brand .logo svg { width:16px; height:16px; stroke:var(--ink); }
    .spacer { flex:1; }
    .menu-wrap { position:relative; }
    .menu { position:absolute; top:46px; left:0; background:var(--paper); border:1px solid var(--ink); border-radius:var(--rcard); padding:7px; min-width:210px; box-shadow:var(--sh2); display:none; }
    .menu.open { display:block; }
    .menu-item { display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; font-size:13px; font-weight:500; color:var(--ink); width:100%; }
    .menu-item:hover { background:var(--lime); }
    .menu-item .k { margin-left:auto; color:var(--steel); font-size:11px; font-weight:700; }
    .menu-sep { height:1px; background:var(--ink); margin:6px 4px; opacity:.15; }
    .status { font-size:12px; color:var(--iron); display:flex; align-items:center; gap:7px; font-weight:700; border:1px solid var(--ink); border-radius:var(--rpill); padding:5px 12px; background:var(--paper); }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--steel); border:1px solid var(--ink); }
    .dot.saved { background:var(--lime); } .dot.saving { background:var(--amber); } .dot.edited { background:var(--sky); }

    .mid { display:grid; grid-template-columns:214px 1fr 338px; overflow:hidden; }

    .side { background:var(--paper); border-right:1px solid var(--ink); overflow-y:auto; padding:16px; }
    .sec-title { font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink); margin:6px 0 11px; font-weight:700; }
    .add-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:20px; }
    .add-grid .btn { flex-direction:column; padding:13px 4px; gap:7px; font-size:12px; border-radius:12px; }
    .add-grid .btn.wide { grid-column:1/3; flex-direction:row; }
    .add-grid .btn svg { width:18px; height:18px; }
    .drop { border:1.5px dashed var(--ink); border-radius:12px; padding:18px 8px; text-align:center; color:var(--iron); font-size:12px; cursor:pointer; margin-bottom:14px; display:flex; flex-direction:column; align-items:center; gap:8px; background:var(--fog); font-weight:500; }
    .drop:hover, .drop.over { background:var(--mint); }
    .asset-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .asset { position:relative; border-radius:12px; overflow:hidden; aspect-ratio:16/10; background:var(--fog); cursor:grab; border:1px solid var(--ink); box-shadow:var(--sh0); transition:transform .1s; }
    .asset:hover { transform:translate(-1px,-1px); box-shadow:var(--sh1); }
    .asset img, .asset video { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
    .asset .nm { position:absolute; bottom:0; left:0; right:0; font-size:9px; padding:3px 5px; background:var(--paper); border-top:1px solid var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
    .asset .badge { position:absolute; top:5px; left:5px; font-size:8px; background:var(--lime); border:1px solid var(--ink); padding:1px 6px; border-radius:100px; font-weight:700; text-transform:uppercase; }

    /* preview — whiteboard dot grid */
    .stagewrap { display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; background:radial-gradient(circle, #d8d8d8 1.2px, transparent 1.2px) 0 0/24px 24px, var(--fog); }
    #scaler { position:relative; }
    #stage { position:relative; border-radius:10px; border:1px solid var(--ink); box-shadow:var(--sh2); }

    .right { background:var(--paper); border-left:1px solid var(--ink); display:flex; flex-direction:column; overflow:hidden; }
    .tabs { display:flex; padding:12px 12px 0; gap:8px; border-bottom:1px solid var(--ink); }
    .tab { flex:1; padding:10px; border-radius:12px 12px 0 0; font-weight:700; font-size:13px; color:var(--steel); display:flex; align-items:center; justify-content:center; gap:7px; border:1px solid transparent; }
    .tab.on { color:var(--ink); background:var(--lime); border:1px solid var(--ink); border-bottom:1px solid var(--lime); margin-bottom:-1px; }
    .right-body { flex:1; overflow-y:auto; padding:16px; }
    .right-body h3 { font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink); margin:18px 0 9px; font-weight:700; }
    .right-body h3:first-child { margin-top:0; }
    .sel-head { display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:12px; background:var(--buttercream); border:1px solid var(--ink); box-shadow:var(--sh0); margin-bottom:8px; }
    .sel-head .pill { font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 10px; border-radius:100px; border:1px solid var(--ink); color:var(--ink); display:flex; align-items:center; gap:5px; }
    .sel-head .pill svg { width:12px; height:12px; }
    .field { margin-bottom:12px; }
    .field label { display:block; font-size:11px; color:var(--iron); margin-bottom:5px; font-weight:700; }
    .field input[type=text], .field textarea, .field select { width:100%; background:var(--paper); border:1px solid var(--ink); color:var(--ink); border-radius:var(--rin); padding:8px 10px; font-size:12px; font-family:inherit; font-weight:500; }
    .field input:focus, .field textarea:focus, .field select:focus { outline:none; box-shadow:var(--sh1); }
    .field textarea { resize:vertical; min-height:46px; }
    .row { display:flex; align-items:center; gap:9px; }
    .row input[type=range] { flex:1; accent-color:var(--lime); }
    .row .val { width:50px; text-align:right; font-variant-numeric:tabular-nums; font-size:11px; color:var(--iron); font-weight:700; }

    .cat-tabs { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
    .cat { padding:6px 13px; border-radius:100px; font-size:12px; font-weight:700; background:var(--paper); border:1px solid var(--ink); color:var(--ink); box-shadow:var(--sh0); }
    .cat.on { background:var(--lime); }
    .anim-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .anim-card { background:var(--paper); border:1px solid var(--ink); border-radius:12px; padding:11px; cursor:pointer; box-shadow:var(--sh0); transition:transform .1s; }
    .anim-card:hover { transform:translate(-1px,-1px); box-shadow:var(--sh1); background:var(--mint); }
    .anim-card .nm { font-size:12px; font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:5px; }
    .anim-card .nm svg { width:13px; height:13px; }
    .anim-card .ds { font-size:10px; color:var(--iron); line-height:1.4; font-weight:500; }
    .preset-card { background:var(--lilac); border:1px solid var(--ink); border-radius:12px; padding:11px; margin-bottom:9px; box-shadow:var(--sh0); }
    .preset-card .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .preset-card .head b { font-size:12px; font-weight:700; }
    .icon-btn { padding:4px 8px; border-radius:8px; background:var(--paper); color:var(--ink); border:1px solid var(--ink); font-weight:700; }
    .icon-btn:hover { background:var(--bubblegum); }
    .empty { color:var(--iron); font-size:12px; padding:36px 14px; text-align:center; line-height:1.7; font-weight:500; }

    .timeline { background:var(--paper); border-top:1px solid var(--ink); display:flex; flex-direction:column; overflow:hidden; }
    .transport { display:flex; align-items:center; gap:14px; padding:10px 18px; border-bottom:1px solid var(--ink); background:var(--fog); }
    .tp-time { font-variant-numeric:tabular-nums; font-size:15px; font-weight:700; min-width:140px; }
    .tp-time .tot { color:var(--steel); font-weight:500; }
    .tp-center { display:flex; align-items:center; gap:10px; }
    .tp-btn { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--paper); border:1px solid var(--ink); color:var(--ink); box-shadow:var(--sh0); }
    .tp-btn:active { transform:translate(1px,1px); box-shadow:none; }
    .tp-btn.on { background:var(--lime); }
    .tp-play { width:46px; height:46px; background:var(--lime); box-shadow:var(--sh1); }
    .tp-play svg { width:19px; height:19px; }
    .hint { color:var(--iron); font-size:11px; font-weight:500; }
    .tl-scroll { flex:1; overflow:auto; position:relative; background:var(--paper); }
    #tlInner { position:relative; min-width:100%; }
    .ruler { position:sticky; top:0; height:26px; background:var(--fog); border-bottom:1px solid var(--ink); z-index:5; cursor:pointer; }
    .tick { position:absolute; top:0; height:26px; border-left:1px solid var(--ink); opacity:1; font-size:10px; color:var(--iron); padding-left:4px; padding-top:3px; font-weight:700; }
    .scene-row { display:flex; align-items:center; height:24px; background:var(--buttercream); border-bottom:1px solid var(--ink); position:relative; }
    .scene-tag { position:sticky; left:0; z-index:4; padding:0 10px; height:24px; display:flex; align-items:center; gap:6px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink); }
    .scene-tag svg { width:11px; height:11px; }
    .track { position:relative; height:42px; border-bottom:1px solid #00000022; }
    .track-label { position:absolute; left:0; top:0; z-index:4; width:104px; height:42px; display:flex; align-items:center; gap:7px; padding:0 10px; background:var(--fog); border-right:1px solid var(--ink); font-size:11px; color:var(--iron); overflow:hidden; white-space:nowrap; font-weight:700; }
    .track-label svg { width:13px; height:13px; flex-shrink:0; }
    .clip { position:absolute; top:6px; height:30px; border-radius:9px; display:flex; align-items:center; gap:6px; padding:0 9px; font-size:11px; color:var(--ink); cursor:grab; overflow:hidden; white-space:nowrap; border:1px solid var(--ink); box-shadow:var(--sh0); user-select:none; font-weight:700; }
    .clip svg { width:12px; height:12px; }
    .clip.sel { box-shadow:var(--sh1); outline:2px solid var(--ink); }
    .clip .handle { position:absolute; right:0; top:0; width:9px; height:100%; cursor:ew-resize; background:#0000002e; }
    .playhead { position:absolute; top:0; width:2px; background:var(--ink); z-index:6; pointer-events:none; }
    .playhead::before { content:''; position:absolute; top:0; left:-6px; border:7px solid transparent; border-top-color:var(--amber); }
    .tl-scroll.over { box-shadow:inset 0 0 0 3px var(--lime); }

    .render-bar { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); width:440px; background:var(--paper); border:1px solid var(--ink); border-radius:16px; padding:16px 18px; box-shadow:var(--sh2); z-index:100; opacity:0; pointer-events:none; transition:.25s; }
    .render-bar.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
    .render-bar .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:13px; font-weight:700; }
    .render-bar .pct { font-variant-numeric:tabular-nums; }
    .render-track { height:10px; background:var(--fog); border:1px solid var(--ink); border-radius:100px; overflow:hidden; }
    .render-fill { height:100%; width:0%; background:var(--lime); transition:width .2s ease; }

    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; display:none; align-items:center; justify-content:center; }
    .modal-bg.show { display:flex; }
    .modal { background:var(--paper); border:1px solid var(--ink); border-radius:16px; padding:22px; width:460px; box-shadow:var(--sh2); }
    .modal h2 { font-size:18px; font-weight:700; margin-bottom:16px; letter-spacing:-0.02em; }
    .proj { display:flex; align-items:center; gap:10px; padding:12px; border-radius:10px; background:var(--paper); border:1px solid var(--ink); box-shadow:var(--sh0); margin-bottom:8px; cursor:pointer; font-size:13px; font-weight:500; }
    .proj:hover { background:var(--mint); }
    .proj.active { background:var(--lime); }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="brand"><span class="logo" id="logoIcon"></span>VIDEOGENPRO</div>
      <div class="menu-wrap">
        <button class="btn" id="fileBtn"><span id="fileIcon"></span>File</button>
        <div class="menu" id="fileMenu"></div>
      </div>
      <div class="spacer"></div>
      <span class="status"><span class="dot saved" id="syncDot"></span><span id="syncText">synced</span></span>
      <button class="btn primary" id="export"><span id="expIcon"></span>Export</button>
    </div>

    <div class="mid">
      <div class="side">
        <div class="sec-title">Add layer</div>
        <div class="add-grid">
          <button class="btn" id="addText"><span id="i-text"></span>Text</button>
          <button class="btn" id="addShape"><span id="i-shape"></span>Shape</button>
          <button class="btn wide" id="add3D"><span id="i-3d"></span>3D Particles</button>
        </div>
        <div class="sec-title">Assets</div>
        <div class="drop" id="drop"><span id="i-up"></span>Drop / click to upload</div>
        <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none" />
        <div class="asset-grid" id="assetGrid"></div>
      </div>

      <div class="stagewrap"><div id="scaler"><div id="stage"></div></div></div>

      <div class="right">
        <div class="tabs">
          <button class="tab on" id="tabProps"><span id="i-props"></span>Properties</button>
          <button class="tab" id="tabAnim"><span id="i-anim"></span>Animations</button>
        </div>
        <div class="right-body" id="rightBody"></div>
      </div>
    </div>

    <div class="timeline">
      <div class="transport">
        <div class="tp-time"><span id="tpTime">0.00</span><span class="tot" id="tpTotal"> / 0.00s</span></div>
        <div class="spacer"></div>
        <div class="tp-center">
          <button class="tp-btn" id="tpStart" title="Start"></button>
          <button class="tp-btn" id="tpBack" title="−1s"></button>
          <button class="tp-btn tp-play" id="tpPlay" title="Play / Pause (space)"></button>
          <button class="tp-btn" id="tpFwd" title="+1s"></button>
          <button class="tp-btn on" id="tpLoop" title="Loop"></button>
        </div>
        <div class="spacer"></div>
        <span class="hint">scroll to pan · ⌘/ctrl + scroll to zoom · S split · ⌘D dup</span>
      </div>
      <div class="tl-scroll" id="tlScroll"><div id="tlInner"></div></div>
    </div>
  </div>

  <div class="render-bar" id="renderBar">
    <div class="top"><span id="renderLabel">Rendering…</span><span class="pct" id="renderPct">0%</span></div>
    <div class="render-track"><div class="render-fill" id="renderFill"></div></div>
  </div>

  <div class="modal-bg" id="openModal">
    <div class="modal">
      <h2>Open project</h2>
      <div id="projList"></div>
      <div style="margin-top:16px; display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn" id="importBtn">Import .json…</button>
        <button class="btn primary" id="openClose">Close</button>
      </div>
    </div>
  </div>

  <script src="/packages/renderer/dist/runtime.js"></script>
  <script src="/packages/editor/dist/editor.js"></script>
</body>
</html>
